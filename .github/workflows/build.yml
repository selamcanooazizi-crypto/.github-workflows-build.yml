name: Build

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: |
          echo "ZIP integration bundle detected"
          find . -type f

      - uses: actions/upload-artifact@v4
        with:
          name: NurikAura
          path: NurikAura_integration_bundle.zip
          if-no-files-found: warn

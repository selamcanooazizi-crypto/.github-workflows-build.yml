      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -o NurikAura_integration_bundle.zip -d extracted

      - name: Find Gradle project
        id: locate
        run: |
          ROOT="$(find extracted -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print -quit)"
          if [ -z "$ROOT" ]; then
            echo "ZIP içinde Gradle projesi bulunamadı."
            find extracted -type f
            exit 1
          fi
          echo "dir=$(dirname "$ROOT")" >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: compiled-jar
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error

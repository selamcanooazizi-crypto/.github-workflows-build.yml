name: Build JAR

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract source ZIP
        run: |
          unzip -o "NurikAura_integration_bundle.zip" -d .

      - name: Find Gradle project
        run: |
          find . -name build.gradle -o -name build.gradle.kts

      - name: Build
        run: |
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NurikAura-JAR
          path: '**/build/libs/*.jar'

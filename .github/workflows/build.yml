name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -iname "*.zip" -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ZIP not found"
            exit 1
          fi
          mkdir extracted
          unzip -o "$ZIP" -d extracted

      - name: Find Gradle project
        id: project
        run: |
          FILE=$(find extracted -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -print -quit)
          if [ -z "$FILE" ]; then
            echo "No Gradle project inside ZIP!"
            find extracted -maxdepth 4 -type f
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Gradle project found in $DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: compiled-jars
          path: extracted/**/build/libs/*.jar
          if-no-files-found: warn

name: Build JAR

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Gradle project
        id: locate
        run: |
          ROOT="$(find . -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -not -path './.github/*' -print -quit)"
          if [ -z "$ROOT" ]; then
            echo "Gradle project files are missing."
            echo "Repository file list:"
            find . -maxdepth 5 -type f
            exit 1
          fi
          echo "dir=$(dirname "$ROOT")" >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: compiled-jar
          path: '**/build/libs/*.jar'
          if-no-files-found: error

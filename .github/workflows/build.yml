name: Build JAR

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -o NurikAura_integration_bundle.zip -d extracted

      - name: Check project
        run: |
          find extracted -type f
          find extracted -type f \( -name "build.gradle" -o -name "build.gradle.kts" \)

      - name: Build
        run: |
          echo "Checking for Gradle project..."
          FILE=$(find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -not -path "./.github/*" -print -quit)
          if [ -z "$FILE" ]; then
            echo "No Gradle project found. Cannot compile JAR."
            exit 1
          fi
          gradle build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NurikAura-JAR
          path: '**/build/libs/*.jar'
          if-no-files-found: error
